classes:
- car
- person
- truck
- bus
models:
  checker:
    weights: yolo26l.pt
    conf: 0.1
    cache: data/cache/checker_preds.json
intake:
  min_side_px: 250
  reference_dirs:
  - data/test/images
  - data/gold_val/images
duplicates:
  phash_dist: 8
label_format:
  overflow_tol: 0.002
  min_box_px: 12
  max_box_frac: 0.95
  dup_box_iou: 0.9
stats:
  rare_class_min_boxes: 5
  dense_image_max_boxes: 25
second_opinion:
  conf: 0.8
  min_area_px: 600
  fp_conf: 0.1
  iou_missing: 0.3
  iou_match: 0.5
  iou_loose: 0.5
review:
  budget_images: 80
  weights:
    POSSIBLE_WRONG_CLASS: 3
    POSSIBLE_MISSING: 2
    POSSIBLE_FALSE_POS: 2
    POSSIBLE_LOOSE_BOX: 1.5
    BOX_TINY: 0.3
    BOX_HUGE: 0.5
    EMPTY_LABEL: 1
    DENSE_IMAGE: 0.3
    FIXED_DROP_LINE: 2
    FIXED_CLIP_BOX: 1
    NEEDS_LABEL: 10
    default: 1
gate:
  warn_ratio_hold: 0.1
